  .support-center-container > * {
    flex-shrink: 0;
  }
          
  .support-center-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    pointer-events: none;
    justify-content: flex-end;
  }
  
  .support-center-container,
  .support-center-container * {
    box-sizing: border-box;
  }

  .support-center-container iframe {
    overflow: hidden;
    pointer-events: auto;
  }

  .support-center-container-opened iframe {
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.24);
    animation: open 500ms ease-out;
  }

  .support-center-container-closed iframe {
    animation: close 500ms ease-out;
  }

  .support-center-container-notifications {
    transition: height 0.3s;
  }
  
  .support-center-container > button.support-center-button {
    display: flex;
    justify-content: center;
    align-items: center;
    align-self: flex-end;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    animation: button-appearance 0.5s;
    font-size: 20px;
    line-height: 20px;
    transition: unset;
    position: relative;
    pointer-events: auto;
  }

  button.support-center-button > span.supoprt-center-counter {
    position: absolute;
    top: -4px;
    right: -4px;
    border-radius: 50%;
    font-size: 14px;
    width: 20px;
    height: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Lab Grotesque, Segoe UI, Helvetica Neue, Roboto, Arial, Liberation Sans, Nimbus Sans L, sans-serif;
  }

  .support-center-container > button.support-center-button:hover {
    transform: perspective(1px) scale(1.05) translateZ(0);
    transition: transform 0.2s;
  }

  .support-center-container > button.support-center-button:hover > img {
    transform: perspective(1px) scale(calc(1 / 1.05)) translateZ(0);
    transition: transform 0.2s;
  }

  .support-center-container > button.support-center-button:hover > span.supoprt-center-counter {
    transform: perspective(1px) scale(calc(1 / 1.05)) translateZ(0);
    transition: transform 0.2s;
  }
  
  @keyframes button-appearance {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }

  @keyframes open {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }

  @keyframes close {
    0% {
      opacity: 1;
    }
    70% {
      opacity: 0;
    }
    100% {
      opacity: 0;
    }
  }
